name: Re-ingest blog and project content
on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:  # allows manual trigger from GitHub UI too
jobs:
  reingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          RESUME_PATH: ${{ secrets.RESUME_PATH }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FLAMOLINA_ALLOWED_ORIGINS: ${{ secrets.FLAMOLINA_ALLOWED_ORIGINS }}
        run: python -m ingest.ingest_content
      - name: Run README ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          RESUME_PATH: ${{ secrets.RESUME_PATH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m ingest.ingest
